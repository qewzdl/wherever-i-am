name: Network Soak

on:
  push:
    branches:
      - Qewzdl
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: network-soak-${{ github.repository }}
  cancel-in-progress: false

jobs:
  host-two-clients:
    name: Host + 2 Clients / 15 minute soak
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Run production network soak
        shell: pwsh
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          WIA_NETWORK_SOAK_DURATION_SECONDS: "900"
          WIA_NETWORK_SOAK_STEP_TIMEOUT_SECONDS: "180"
          WIA_NETWORK_SOAK_LATENCY_MS: "80"
          WIA_NETWORK_SOAK_JITTER_MS: "20"
          WIA_NETWORK_SOAK_PACKET_LOSS_PERCENT: "2"
        run: ./ci/run-network-soak.ps1

      - name: Upload network soak artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-soak-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/network-soak
          if-no-files-found: warn
          retention-days: 14
